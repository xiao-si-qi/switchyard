name: Switchyard
version: "0.6.0"
slug: switchyard
description: ESP32 设备统一上位机：设备台账、屏幕布局下发、固件 OTA
url: https://github.com/xiao-si-qi/switchyard
arch:
  - aarch64
  - amd64
  - armv7
init: false
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:transit-connection-variant
panel_title: Switchyard
map:
  - config:rw
options:
  www_dir: /config/www/switchyard
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  public_url: ""
  device_stale_seconds: 300
schema:
  www_dir: str
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  public_url: str
  device_stale_seconds: int
